[package]
name = "hodlwarz_rewards"
version = "0.1.0"
description = "WARZ season rewards — mainnet token escrow with per-player claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hodlwarz_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
